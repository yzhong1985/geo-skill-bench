id: buffer_school_500m_reference_db_001
name: 学校周边 500 米缓冲区分析（参考来自 PostGIS 表）
version: 1.0.0
type: agent_skill_test
description: >
  与 buffer_school_500m_reference_001 相同，但参考数据集从 PostGIS 表拉取
  （format: db_table），验证结果比对 + DB 拉取数据在 cleanup 时删除。
target:
  skill_id: gis_buffer_analysis
  skill_version: 1.0.0
runtime:
  executor: skill
  agent_model: rule-based-agent
  max_turns: 6
  timeout_seconds: 180
  memory_enabled: false
data:
  fixtures:
    # 输入数据：只需 id + path，其余自动从文件识别
    - id: schools
      path: ../fixtures/schools.geojson
  reference:
    # 参考数据：从 PostGIS 表拉取（仅断言读取，不暴露给 agent；db_url 缺省回落 DATABASE_URL）
    - id: expected_buffer
      type: vector
      format: db_table
      db_url: postgresql+psycopg://geo:geo@localhost:5433/geoskillbench
      table: expected_buffer
mcp:
  servers:
    - id: gpa_vector
      name: GPA 矢量分析 MCP 服务
      transport: http
      url: http://127.0.0.1:8765/mcp
      required: true
    - id: metadata
      name: 空间元数据 MCP 服务
      transport: http
      url: http://127.0.0.1:8765/mcp
      required: true
  tools:
    required:
      - server: metadata
        name: query_dataset_metadata
      - server: gpa_vector
        name: create_buffer
    optional:
      - server: gpa_vector
        name: reproject_dataset
      - server: gpa_vector
        name: publish_map
skill:
  load_mode: file
  path: ../skills/gis_buffer_analysis.skill.yml
  required: true
user_task: >
  请帮我生成 schools 数据周边 500 米的服务范围。
agent:
  user_enabled: true
  user_profile: normal_user
  user_max_turns: 5
  user_goal: >
    如果智能体询问使用哪个数据，请回答使用 schools 数据。
    如果智能体询问缓冲距离，请回答 500 米。
    如果智能体询问输出格式，请回答 GeoJSON。
    不要主动提供未被询问的信息。
  user_model: rule-based-user
expected_behavior:
  should_load_skills:
    - gis_buffer_analysis
  should_call_tools:
    - query_dataset_metadata
    - create_buffer
  optional_tools:
    - reproject_dataset
    - publish_map
  should_not:
    - 直接在 EPSG:4326 下按米做平面缓冲
    - 编造不存在的数据字段
    - 在缺少输入数据时直接执行
assertions:
  - type: result_overlap_ratio
    target: buffer_result
    reference: expected_buffer
    min: 0.9
  - type: result_area_error_max
    target: buffer_result
    reference: expected_buffer
    max_ratio: 0.05
  - type: result_distance_max
    target: buffer_result
    reference: expected_buffer
    max_meters: 20
  - type: result_fields_match
    target: buffer_result
    reference: expected_buffer
    mode: contains
  - type: result_feature_count
    target: buffer_result
    reference: expected_buffer
    count: 2
judge:
  enabled: true
pass_criteria:
  required_assertions_passed: true
  judge_score_min: 0.8
