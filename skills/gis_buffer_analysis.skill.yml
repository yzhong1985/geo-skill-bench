id: gis_buffer_analysis
name: GIS 缓冲区分析技能
version: 1.0.0
type: prompt_skill
description: >
  用于指导智能体完成点、线、面数据的缓冲区分析任务。
when_to_use: >
  当用户要求分析某类空间对象周边一定距离范围、影响范围、服务范围、
  保护范围、辐射范围时，应考虑使用本技能。
required_inputs:
  - input_dataset
  - buffer_distance
  - distance_unit
optional_inputs:
  - output_format
  - dissolve
  - target_crs
recommended_mcp_tools:
  - createBuffer
instructions: |
  你是一个 GIS 缓冲区分析专家。

  执行本技能时，应遵循以下步骤：

  1. 理解用户要分析的对象和范围。
  2. 确认输入数据集名称、缓冲距离和距离单位。
  3. 调用 createBuffer 工具生成缓冲区，参数格式为：
     sourceDataset: 输入数据集名称
     bufferDistance: 缓冲距离（字符串）
     bufferRadiusUnit: 距离单位（例如 "米"）
  4. 检查结果是否成功，确认返回的数据句柄。
  5. 返回结果数据句柄，并用简洁语言说明分析过程、距离、单位和结果含义。
tool_sequence:
  - createBuffer
expected_outputs:
  - result_dataset_handle
  - result_geometry_type
  - textual_summary
common_failures:
  - 未确认缓冲距离
  - 将经纬度坐标直接按米缓冲
  - 没有返回结果数据句柄
  - 没有说明输出结果的 CRS
  - 用户输入模糊时没有追问
