[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoskillbench"
version = "0.0.6"
description = "MVP GIS Agent Skill evaluation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # 版本 pin 到本机实际验证过的最低版本（fresh 环境避免拉起不同大版本）
  "fastapi>=0.141.1",
  "langchain>=1.3.14",
  "langchain-core>=1.5.3",
  "langchain-openai>=1.4.3",
  "langgraph>=1.2.10",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
  "uvicorn>=0.52.1",
  "sqlalchemy>=2.0.52",
  "psycopg[binary]>=3.3.4",
  "geopandas>=1.1.4",        # 结果内容比对（M1 真实缓冲产出 + M2 result_* 断言）
  "httpx>=0.28.1",         # 代码实 import（http_agent_executor.py），原声明缺失
  "python-dotenv>=1.1",    # 代码实 import（db.py load_dotenv），原声明缺失
  "mcp>=1.29.0,<2.0",      # 迭代3 真 MCP 客户端（adapter 走 stdio/sse 协议）；<2.0 防未验证的 2.x 大版本
  "fastmcp>=3.4.7",        # 迭代3 mock MCP server（mock_gis_server.py）
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[project.scripts]
geoskillbench = "geoskillbench.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
